<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | First Fifteen Days</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background: #FFF9F5;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 42px;
            border-radius: 22px;
            border: 1px solid #F2E4DA;
            box-shadow: 0 12px 40px #9b73501a;
        }

        .login-logo {
            text-align: center;
            font-size: 42px;
        }

        .login-card h1 {
            text-align: center;
            margin: 15px 0 8px;
            color: #594638;
        }

        .login-subtitle {
            text-align: center;
            color: #927966;
            margin-bottom: 30px;
        }

        .login-card label {
            display: block;
            margin: 17px 0 8px;
            font-weight: 600;
            color: #594638;
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            border: 1px solid #EBD9CA;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        .login-card input:focus {
            border-color: #D9A887;
        }

        .login-card button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
        }

        .login-extra {
            text-align: center;
            margin-top: 22px;
            color: #806B5C;
            font-size: 13px;
        }

        .login-extra a {
            color: #C58D6A;
            text-decoration: none;
            font-weight: bold;
        }

        .login-note {
            text-align: center;
            margin-top: 20px;
            color: #A18B7B;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">🎓</div>
            <h1>Welcome Back!</h1>
            <p class="login-subtitle">
                Your First Fifteen Days at LPU start here.
            </p>

            <form onsubmit="demoLogin(event)">
                <label for="email">Student Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="submit">Login to Dashboard →</button>
            </form>
            <p class="login-extra">
                New student?
                <a href="signup.html">Create Account</a>
            </p>
            <p id="loginMessage" class="login-extra"></p>


            <p class="login-note">
                Student project demo login. Do not enter your actual LPU password.
            </p>
        </div>
    </div>

    <script>
        function demoLogin(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) return;

            // Demo only: no real account authentication
            window.location.href = "dashboard.html";
        }

        function showSignup(event) {
            event.preventDefault();
            alert("Account registration will be added in a future version.");
        }
    </script>

</body>

</html>
